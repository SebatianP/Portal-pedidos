<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de pedidos internos</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2631;--mute:#66717d;--line:#d9dee4;--side:#16313f;--accent:#e8a317;
--pend:#b26a00;--pendbg:#fff1d6;--acep:#1b5fa8;--acepbg:#dcebfa;--conf:#1d7a4d;--confbg:#d9f2e4;--rech:#a33a3a;--rechbg:#f8e0e0}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:#dbe6ec;padding:24px 18px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
aside h1{font-size:17px;margin:0 0 2px;color:#fff;font-weight:600}
aside p{margin:0 0 22px;font-size:12px;color:#8fa6b3}
aside a{padding:9px 10px;border-radius:6px;font-size:14px;color:#dbe6ec;text-decoration:none}
aside a.on{background:#24475a;color:#fff;box-shadow:inset 3px 0 var(--accent)}
.user{margin-top:auto;font-size:13px;border-top:1px solid #2b4a5a;padding-top:14px}
.user b{display:block;color:#fff;font-weight:500}
main{flex:1;padding:28px 32px;min-width:0}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
header h2{margin:0;font-size:24px;font-weight:600}
header span{color:var(--mute);font-size:14px}
input[type=search]{padding:9px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;width:240px;max-width:100%}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.tab b{margin-left:8px;font-weight:600}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:90px 1.6fr 1.2fr 110px 120px 210px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row.head{background:#f6f8fa;color:var(--mute);font-size:13px;font-weight:500}
.id{font-weight:600}
.obj small,.who small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:500}
.b-pendiente{background:var(--pendbg);color:var(--pend)}.b-aceptado{background:var(--acepbg);color:var(--acep)}
.b-confirmado{background:var(--confbg);color:var(--conf)}.b-rechazado{background:var(--rechbg);color:var(--rech)}
.acts{display:flex;gap:6px;justify-content:flex-end}
button.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
button.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn.ok{background:var(--conf);color:#fff;border-color:var(--conf)}
button.btn:hover{filter:brightness(.93)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:40px;text-align:center;color:var(--mute)}
.foot{margin-top:14px;font-size:13px;color:var(--mute)}
.foot button{background:none;border:0;color:var(--acep);cursor:pointer;font:inherit;text-decoration:underline;padding:0}
#toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media(max-width:980px){
 body{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px}aside p,.user{display:none}aside h1{margin:0 12px 0 0}
 main{padding:18px}.row.head{display:none}
 .row{grid-template-columns:1fr auto;grid-template-areas:"id st" "obj obj" "who who" "date date" "acts acts"}
 .row>:nth-child(1){grid-area:id}.row>:nth-child(2){grid-area:obj}.row>:nth-child(3){grid-area:who}
 .row>:nth-child(4){grid-area:date}.row>:nth-child(5){grid-area:st;justify-self:end}.row>:nth-child(6){grid-area:acts}.acts{justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<aside>
  <h1>Almacén Norte</h1><p>Portal interno</p>
  <a class="on" href="#">Pedidos</a><a href="#">Inventario</a><a href="#">Historial</a>
  <div class="user"><b>Laura Gómez</b>Jefa de bodega</div>
</aside>
<main>
  <header>
    <div><h2>Pedidos de materiales</h2><span id="sub"></span></div>
    <input type="search" id="q" placeholder="Buscar por objeto, área o número" aria-label="Buscar pedidos">
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <p class="foot">Datos de demostración guardados en este navegador. <button id="reset">Restablecer pedidos</button></p>
</main>
<div id="toast" role="status"></div>
<script>
const SEED=[
{id:"P-1042",obj:"Laptop Dell 14\"",qty:2,area:"Contabilidad",por:"Andrés Rojas",fecha:"2026-09-28",estado:"pendiente"},
{id:"P-1043",obj:"Resma de papel carta",qty:15,area:"Recursos Humanos",por:"Marcela Díaz",fecha:"2026-09-28",estado:"pendiente"},
{id:"P-1044",obj:"Casco de seguridad",qty:8,area:"Producción",por:"Julián Pérez",fecha:"2026-09-29",estado:"pendiente"},
{id:"P-1045",obj:"Monitor 24\"",qty:3,area:"Sistemas",por:"Camila Torres",fecha:"2026-09-29",estado:"aceptado"},
{id:"P-1046",obj:"Silla ergonómica",qty:4,area:"Ventas",por:"Felipe Castro",fecha:"2026-09-29",estado:"aceptado"},
{id:"P-1047",obj:"Guantes de nitrilo (caja)",qty:10,area:"Producción",por:"Julián Pérez",fecha:"2026-09-30",estado:"pendiente"},
{id:"P-1048",obj:"Teclado y mouse inalámbricos",qty:6,area:"Sistemas",por:"Camila Torres",fecha:"2026-09-27",estado:"confirmado"},
{id:"P-1049",obj:"Impresora láser",qty:1,area:"Administración",por:"Sofía Vargas",fecha:"2026-09-26",estado:"rechazado"}
];
const LABEL={pendiente:"Pendiente",aceptado:"Aceptado",confirmado:"Confirmado",rechazado:"Rechazado"};
let data,filtro="pendiente",texto="";
try{data=JSON.parse(localStorage.getItem("pedidos"))}catch(e){}
if(!Array.isArray(data))data=JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem("pedidos",JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function fmt(f){return new Date(f+"T12:00").toLocaleDateString("es-CO",{day:"numeric",month:"short"})}
function cambiar(id,estado,msg){const p=data.find(x=>x.id===id);p.estado=estado;save();render();toast(id+" "+msg)}
function render(){
  const cuenta=e=>data.filter(p=>e==="todos"||p.estado===e).length;
  $("sub").textContent=cuenta("pendiente")+" pedidos esperan tu respuesta";
  $("tabs").innerHTML=["pendiente","aceptado","confirmado","rechazado","todos"].map(e=>
    `<button class="tab ${e===filtro?"on":""}" data-f="${e}">${e==="todos"?"Todos":LABEL[e]+"s"}<b>${cuenta(e)}</b></button>`).join("");
  const t=texto.toLowerCase();
  const rows=data.filter(p=>(filtro==="todos"||p.estado===filtro)&&(!t||(p.obj+p.area+p.id+p.por).toLowerCase().includes(t)));
  $("list").innerHTML=`<div class="row head"><div>Pedido</div><div>Objeto</div><div>Solicitante</div><div>Fecha</div><div>Estado</div><div></div></div>`+
  (rows.length?rows.map(p=>{
    let a="";
    if(p.estado==="pendiente")a=`<button class="btn" data-a="rechazar" data-id="${p.id}">Rechazar</button><button class="btn pri" data-a="aceptar" data-id="${p.id}">Aceptar pedido</button>`;
    if(p.estado==="aceptado")a=`<button class="btn ok" data-a="confirmar" data-id="${p.id}">Confirmar entrega</button>`;
    return `<div class="row"><div class="id">${p.id}</div><div class="obj">${p.obj}<small>Cantidad: ${p.qty}</small></div>
    <div class="who">${p.por}<small>${p.area}</small></div><div>${fmt(p.fecha)}</div>
    <div><span class="badge b-${p.estado}">${LABEL[p.estado]}</span></div><div class="acts">${a}</div></div>`}).join("")
  :`<div class="empty">No hay pedidos ${filtro==="todos"?"que coincidan":"en este estado"}.</div>`);
}
$("tabs").onclick=e=>{const b=e.target.closest("[data-f]");if(b){filtro=b.dataset.f;render()}};
$("list").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a;
  if(a==="aceptar")cambiar(id,"aceptado","aceptado");
  if(a==="rechazar")cambiar(id,"rechazado","rechazado");
  if(a==="confirmar")cambiar(id,"confirmado","confirmado como entregado")};
$("q").oninput=e=>{texto=e.target.value;render()};
$("reset").onclick=()=>{data=JSON.parse(JSON.stringify(SEED));save();render();toast("Pedidos restablecidos")};
render();
</script>
</body>
</html>
