<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de pedidos · Guías (prototipo)</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<aside>
  <div class="logo">Gestión</div>
  <div class="sec">OPERACIÓN</div>
  <a>Pedidos</a>
  <a id="nav-guias" class="on" data-v="guias">Guías</a>
  <a id="nav-rev" data-v="rev">Revisiones <span class="cnt" id="badge"></span></a>
  <a>Encuestas</a><a>Indicadores</a>
  <div class="sec">CLIENTES</div><a>Cartera</a><a>Base de datos</a>
  <div class="who">Sesión de práctica
    <select id="user" aria-label="Usuario activo"></select><span id="rol"></span></div>
</aside>
<main id="main"></main>

<dialog id="dUp">
  <h3>Subir Excel del rastreo</h3>
  <p style="margin:0;color:var(--mute)">Simulación: no hace falta elegir un archivo real; se genera una lectura de ejemplo.</p>
  <label for="revisor">Enviar a revisión de</label>
  <select id="revisor" class="f"></select>
  <div class="row"><button class="btn" id="upCancel">Cancelar</button><button class="btn dark" id="upSend">Enviar a revisión</button></div>
</dialog>
<dialog id="dRet">
  <h3>Devolver para revisión</h3>
  <label for="coment">¿Qué debe corregirse?</label>
  <textarea id="coment" rows="4" placeholder="Ejemplo: la guía 8233...4903 aparece entregada pero el pedido sigue en despacho."></textarea>
  <div class="row"><button class="btn" id="retCancel">Cancelar</button><button class="btn bad" id="retSend">Devolver con comentario</button></div>
</dialog>
<div id="toast" role="status"></div>

<!-- El orden importa: cada archivo usa lo definido en los anteriores -->
<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/actions.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
